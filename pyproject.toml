[project]
name = "data-challenge"
version = "0.1.0"
description = "Line detection in spectrograms with diffusion-model residuals"
readme = "README.md"
# Keep all contributors on the minor version recorded in .python-version.
# This avoids platform-dependent dependency resolution between Python 3.13 and later.
requires-python = ">=3.13,<3.14"
dependencies = [
    "ipykernel>=7.3.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "pythresh>=1.1.1",
    "torch>=2.14.0",
]
